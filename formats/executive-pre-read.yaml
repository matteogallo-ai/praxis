id: executive-pre-read
name: Executive Pre-Read
version: 1.0.0

metadata:
  author: Matteo Gallo
  organization_style: generic
  language: en
  last_reviewed: 2026-08-14

target_length:
  pages: 2
  words: 800

sections:
  - id: context
    title: Context
    purpose: Establish the situation, the decision at stake, and why it demands the reader's attention now. No history-for-history's-sake.
    max_length:
      words: 100
    required_agents:
      - scoping
      - research
    tone_directives: "neutral, factual, third-person; open on the trigger event, not on background.\n\nFRAMING RULES.\n1. The first sentence names the decision surfaced. Not the context. Not 'this report'. THE DECISION.\n2. The first sentence contains the subject AND the temporality (immediate / 3-6 months / long-term).\n3. The first paragraph lets the reader decide in 3 lines or fewer whether to keep reading or delegate: advantage / risk / recommendation.\n\nExamples for this format.\nOK: 'Approve the $12M ARR acquisition of X by end of Q3. Two risks (regulatory, integration), one mitigation each.'\nNO: 'This memo examines the strategic implications of a potential acquisition...'"
    tone_hook: "Open with the decision. Not the context. Not the framing. THE DECISION. Reader must know within 15 words whether to keep reading or delegate."
    validation_rules:
      - "must_contain_trigger_event: true"
      - "max_sentences_per_paragraph: 3"

  - id: key-question
    title: Key Question
    purpose: State the single decision the reader must make, phrased as one closed question.
    max_length:
      words: 50
    required_agents:
      - scoping
    tone_directives: "crisp, closed-form question; no compound 'and/or' formulations.\n\nFRAMING RULES.\n1. The question IS the decision — do not hide it behind a preamble.\n2. Name the subject and the temporality inside the question itself.\n3. A reader who sees only this question knows what triage call is required."
    validation_rules:
      - "must_be_single_question: true"
      - "no_bullet_lists: true"

  - id: recommendation
    title: Recommendation
    purpose: Deliver the recommended answer to the key question in the first sentence. The rest justifies scope, timing, and ownership.
    max_length:
      words: 150
    required_agents:
      - options
      - synthesis
    tone_directives: "authoritative, imperative; lead with the verb; name the owner and the deadline.\n\nFRAMING RULES.\n1. Verb-first sentence names the decision, the owner, the deadline.\n2. Subject and temporality appear inside the first sentence.\n3. First paragraph 3 lines or fewer: advantage / risk / recommendation."
    validation_rules:
      - "must_state_recommendation_in_first_sentence: true"
      - "must_name_owner: true"
      - "must_name_deadline: true"

  - id: supporting-evidence
    title: Supporting Evidence
    purpose: Present the three to five load-bearing facts that make the recommendation defensible. Each fact carries a source citation.
    max_length:
      words: 300
    required_agents:
      - research
      - stakeholder
    tone_directives: "evidentiary, structured; one paragraph per fact; source in parentheses at end of paragraph.\n\nFRAMING RULES.\n1. The opening sentence of each paragraph states the load-bearing fact — not 'this section covers...'.\n2. Each paragraph identifies the subject and the temporality the fact refers to.\n3. A reader skimming only the first sentence of each paragraph can triage the case."
    validation_rules:
      - "min_citations: 3"
      - "max_citations: 7"
      - "every_paragraph_ends_with_citation: true"

  - id: risks-and-mitigations
    title: Risks and Mitigations
    purpose: Name the two or three risks that could invalidate the recommendation and pair each with a concrete mitigation the owner can execute.
    max_length:
      words: 150
    required_agents:
      - risk
      - adversarial
    tone_directives: "honest, ungarnished; one line naming the risk, one line naming the mitigation.\n\nFRAMING RULES.\n1. Each risk sentence names the risk itself, not 'we should consider...'.\n2. Subject and temporality of the risk are inside the first sentence.\n3. A reader can triage severity from the first line alone."
    validation_rules:
      - "min_risks: 2"
      - "max_risks: 3"
      - "each_risk_paired_with_mitigation: true"

  - id: next-steps
    title: Next Steps
    purpose: List the immediate actions the reader triggers on approval, with named owner and date for each.
    max_length:
      words: 50
    required_agents:
      - synthesis
    tone_directives: "imperative, ordered; verb-first bullets are permitted here only.\n\nFRAMING RULES.\n1. Each bullet leads with the action verb — the decision to execute.\n2. Owner and date appear inside the bullet, not in a footnote.\n3. A reader skimming the list knows what triggers on approval."
    validation_rules:
      - "every_step_has_owner_and_date: true"

sourcing_policy: strict

sourcing_rules:
  freshness:
    max_source_age_days: 730
    warn_after_days: 365
  domain_trust:
    mode: reputation-only
    reputation_tiers:
      tier_1:
        - reuters.com
        - www.reuters.com
        - bloomberg.com
        - www.bloomberg.com
        - ft.com
        - www.ft.com
        - wsj.com
        - www.wsj.com
        - economist.com
        - www.economist.com
        - nytimes.com
        - www.nytimes.com
        - "*.gov"
        - "*.gov.uk"
        - "*.europa.eu"
        - "*.bund.de"
        - "*.gouv.fr"
        - bundestag.de
        - www.bundestag.de
        - bundeskartellamt.de
        - www.bundeskartellamt.de
        - arbeitsagentur.de
        - www.arbeitsagentur.de
      tier_2:
        - apnews.com
        - www.apnews.com
        - politico.eu
        - www.politico.eu
        - lemonde.fr
        - www.lemonde.fr
        - handelsblatt.com
        - www.handelsblatt.com
        - "*.oecd.org"
        - "*.imf.org"
        - "*.worldbank.org"
        - bitkom.org
        - www.bitkom.org
        - eco.de
        - www.eco.de
        - verdi.de
        - www.verdi.de
        - idc.com
        - www.idc.com
        - bcg.com
        - www.bcg.com
        - hbr.org
        - mckinsey.com
        - www.mckinsey.com
        - bain.com
        - www.bain.com
      tier_3:
        - wikipedia.org
        - "*.wikipedia.org"
      min_tier: 2
  dedupe:
    cross_agent: true
    similarity_threshold: 0.85
  editorial:
    # v0.8: strict_editorial: false preserves v0.7 warn-only behaviour.
    # Set to true to have Synthesis reject-and-regenerate sections
    # that trip forbidden_terms / max_length / validation_rules.
    strict_editorial: false
    max_regeneration_attempts: 2
    forbidden_terms_action: warn
    over_length_action: warn
    validation_rules_action: warn

style_guide:
  voice: authoritative, third-person, no hedging language
  sentence_structure: short declarative sentences, active voice, max 20 words
  forbidden_terms:
    - it seems
    - perhaps
    - we think
    - arguably
    - in our opinion

output_targets:
  - pdf
  - md
