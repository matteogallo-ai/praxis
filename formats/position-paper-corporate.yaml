id: position-paper-corporate
name: Corporate Affairs Position Paper
version: 1.0.0

metadata:
  author: Matteo Gallo
  organization_style: corporate-affairs
  language: en
  last_reviewed: 2026-08-14

target_length:
  pages: 4
  words: 1600

sections:
  - id: issue-framing
    title: Issue Framing
    purpose: Frame the policy or public-affairs issue at stake in institutional terms — what is being decided, by which body, on what timeline, and why the organization has standing to weigh in.
    max_length:
      words: 200
    required_agents:
      - scoping
      - research
    tone_directives: "measured, institutional, third-person; treat the reader as a peer institution, not a lay audience; avoid combat metaphors.\n\nFRAMING RULES.\n1. The first sentence names the position the organization takes and the decision it aims at. Not the context. Not 'this paper reviews...'. THE DECISION.\n2. The first sentence contains the subject AND the temporality (immediate / 3-6 months / long-term).\n3. The first paragraph lets the reader decide in 3 lines or fewer whether to keep reading or delegate: advantage / risk / recommendation.\n\nExamples for this format.\nOK: 'The association should oppose Article 15 as drafted. Three sovereign carve-outs required. Formal position expected by the March 30 hearing.'\nNO: 'The proposed regulation raises several considerations...'"
    validation_rules:
      - "must_name_deciding_body: true"
      - "must_name_decision_deadline: true"
      - "no_bullet_lists: true"

  - id: stakeholder-landscape
    title: Stakeholder Landscape
    purpose: Map the actors involved and their known positions. Cover at minimum decision-makers, aligned stakeholders, opposing stakeholders, and undecided swing voices whose alignment would move the outcome.
    max_length:
      words: 300
    required_agents:
      - stakeholder
      - research
    tone_directives: "descriptive, non-polemical; describe positions without adjectives that impute motive; cite public statements or filings, not private conversations.\n\nFRAMING RULES.\n1. The opening sentence names the stakeholder cluster and its net alignment — not 'the landscape is complex'.\n2. Subject and temporality appear inside the first sentence.\n3. A reader skimming the first line understands which side has momentum."
    validation_rules:
      - "must_cover_supporters_and_opponents: true"
      - "must_identify_swing_stakeholders: true"
      - "min_citations: 4"

  - id: our-position
    title: Our Position
    purpose: State the organization's position in one paragraph of unambiguous language. No conditional voice, no "we would consider" formulations. This paragraph must be quotable verbatim by an external party.
    max_length:
      words: 300
    required_agents:
      - synthesis
    tone_directives: "declarative, first-person institutional ('The organization holds that...'), no hedging, no conditional verbs.\n\nFRAMING RULES.\n1. First sentence = the position itself, quotable verbatim by an external party.\n2. Subject and temporality inside that first sentence.\n3. Reader can triage the organisation's stance from that single line."
    validation_rules:
      - "must_state_position_explicitly: true"
      - "no_conditional_verbs: true"
      - "no_bullet_lists: true"
      - "max_sentences_per_paragraph: 5"

  - id: rationale
    title: Rationale
    purpose: Walk through the reasoning that supports the position — legal grounds, precedent, empirical evidence, and coherence with the organization's prior public commitments. This is the longest section and does the persuasive work.
    max_length:
      words: 400
    required_agents:
      - research
      - options
    tone_directives: "structured argumentation; each paragraph opens with a topic sentence naming the reasoning strand; citations at the end of each strand.\n\nFRAMING RULES.\n1. Each paragraph opens with the reasoning strand itself — not 'we now turn to...'.\n2. The topic sentence carries subject and temporality.\n3. A reader skimming topic sentences reconstructs the rationale."
    validation_rules:
      - "min_reasoning_strands: 3"
      - "min_citations: 6"
      - "must_reference_prior_position: true"

  - id: counter-arguments-addressed
    title: Counter-Arguments Addressed
    purpose: Enumerate the strongest opposing arguments and rebut each on its merits. Address the strongest form of the counter-argument, not a caricature. Skipping this section signals weakness to a professional reader.
    max_length:
      words: 250
    required_agents:
      - adversarial
      - risk
    tone_directives: "fair-minded, non-dismissive; open each rebuttal by restating the counter-argument in its strongest form before answering it.\n\nFRAMING RULES.\n1. Each rebuttal opens by naming the steelmanned counter-argument itself.\n2. Subject and temporality inside the opening restatement.\n3. Reader can triage rebuttal strength from the first two sentences (steelman + core answer)."
    validation_rules:
      - "min_counter_arguments: 2"
      - "each_counter_argument_is_addressed: true"
      - "no_strawman_paraphrasing: true"

  - id: recommended-actions
    title: Recommended Actions
    purpose: List the concrete external and internal actions the organization commits to taking to advance the position. Each action carries a named owner, a deadline, and a public-facing artifact where relevant.
    max_length:
      words: 150
    required_agents:
      - synthesis
    tone_directives: "imperative, verb-first; distinguish public-facing actions from internal preparatory steps.\n\nFRAMING RULES.\n1. Each action opens with its verb — the decision to execute.\n2. Owner and deadline appear inside the bullet, not in a footnote.\n3. Reader skimming the list can triage what the organisation commits to."
    validation_rules:
      - "every_action_has_owner_and_deadline: true"
      - "min_actions: 3"

sourcing_policy: strict

sourcing_rules:
  freshness:
    max_source_age_days: 1095
    warn_after_days: 730
  domain_trust:
    mode: allow-list
    allow_list:
      - reuters.com
      - www.reuters.com
      - bloomberg.com
      - www.bloomberg.com
      - ft.com
      - www.ft.com
      - wsj.com
      - www.wsj.com
      - apnews.com
      - www.apnews.com
      - handelsblatt.com
      - www.handelsblatt.com
      - "*.gov"
      - "*.gov.uk"
      - "*.gouv.fr"
      - "*.europa.eu"
      - "*.oecd.org"
      - "*.imf.org"
      - "*.worldbank.org"
      - "*.un.org"
      - "*.who.int"
      - "*.bund.de"
      - bundestag.de
      - www.bundestag.de
      - bundeskartellamt.de
      - www.bundeskartellamt.de
      - arbeitsagentur.de
      - www.arbeitsagentur.de
      - bitkom.org
      - www.bitkom.org
      - eco.de
      - www.eco.de
      - verdi.de
      - www.verdi.de
      - idc.com
      - www.idc.com
      - pac.org
      - www.pac.org
      - mckinsey.com
      - www.mckinsey.com
      - bcg.com
      - www.bcg.com
      - hbr.org
      - www.hbr.org
  dedupe:
    cross_agent: true
    similarity_threshold: 0.85
  editorial:
    strict_editorial: false
    max_regeneration_attempts: 2
    forbidden_terms_action: warn
    over_length_action: warn
    validation_rules_action: warn

style_guide:
  voice: diplomatic, measured, third-person institutional; never adversarial in tone, however firm in position
  sentence_structure: medium-length declarative, active voice, avoid nominalization chains
  forbidden_terms:
    - obviously
    - clearly
    - everyone knows
    - as everyone agrees
    - it goes without saying

output_targets:
  - pdf
  - docx
