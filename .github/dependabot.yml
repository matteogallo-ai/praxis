# One grouped pull request per ecosystem per week for minor and patch bumps; a
# major bump gets its own pull request, so a breaking release cannot hold back
# the safe updates grouped with it. The prefixes keep the subjects Conventional
# Commits, which the `commits` CI job requires.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
