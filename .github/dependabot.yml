# One grouped pull request per ecosystem per week for minor and patch
# updates. A major update gets its own pull request: grouped with the rest,
# one breaking change (TypeScript 7 in #8) blocks every other update. The
# prefixes keep the subjects Conventional Commits, which the `commits` CI job
# requires.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
