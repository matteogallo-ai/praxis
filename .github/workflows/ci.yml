name: CI

on:
  push:
    branches: [main]
  # Every base, not only main: a pull request stacked on another work branch
  # needs the same checks before it is merged into that branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  test:
    name: typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # No key and no PRAXIS_LIVE_TESTS here: the paid tests under tests/live/ skip.
      - run: bun test

  # The suite pins the CLI clock (tests/helpers/preload.ts). This job runs it
  # with the in-process wall clock years ahead, and PRAXIS_NOW set to the same
  # date for the preload to override: a test that breaks as time passes fails
  # here first. Spawned CLIs keep the real wall clock; PRAXIS_NOW pins them.
  # Only later dates: a format's last_reviewed must not be in the future, and
  # that test reads the real date on purpose.
  test-other-dates:
    name: test · wall clock at ${{ matrix.at }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        at: ["2029-01-01T00:00:00Z", "2040-06-01T00:00:00Z"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test
        env:
          PRAXIS_TEST_SYSTEM_TIME: ${{ matrix.at }}
          PRAXIS_NOW: ${{ matrix.at }}

  prompt-semver:
    name: prompt semver-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit must be present for semver-check to read the old prompts.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # A changed prompt body needs a version bump; a changed @model needs a major one.
      # It runs the CLI of the pinned @promptlang/core, from the lockfile.
      # The base goes through env, never into the script text (A7).
      - run: bun run promptlang semver-check prompts/ --base "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # DoD D5: the repository alone installs, passes its tests and produces a
  # briefing. The clone sits in a directory of its own, so nothing next to it
  # (a PromptLang checkout, a parent package.json) can satisfy an import.
  clean-clone:
    name: clean clone · install, test, brief (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: alone/praxis
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Nothing but the clone in its parent directory
        run: test "$(ls -A alone)" = "praxis"
      - run: bun install --frozen-lockfile
        working-directory: alone/praxis
      - run: bun test
        working-directory: alone/praxis
      # No ANTHROPIC_API_KEY in CI: the brief runs on the mock provider.
      - run: bun run cli brief "Should we enter the German market?" --format auto --full
        working-directory: alone/praxis

  lint:
    name: biome · knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip

  claims:
    name: claims (rule 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Every shipped claim's tests pass; README matches docs/CLAIMS.md
        run: bun run check:claims

  stale-narrative:
    name: stale narrative (rule 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run check:stale-narrative

  bench-mock:
    name: renderer smoke test (bench:mock, no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run bench:mock
      - name: The committed mock artefacts are exactly what the run produces
        # porcelain also catches new untracked files, which `git diff` would miss.
        run: |
          git status --porcelain -- benchmarks/outputs
          test -z "$(git status --porcelain -- benchmarks/outputs)"

  commits:
    name: conventional commits (rule 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Every commit subject in the range is a Conventional Commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has an all-zero "before" and a force-push leaves it unreachable;
          # both fall back to everything not yet on main.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main "$HEAD")
            echo "Base commit unavailable; checking $BASE..$HEAD (since main)."
          fi
          bun run scripts/check-commits.ts "$BASE..$HEAD"
