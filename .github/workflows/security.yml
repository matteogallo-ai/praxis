name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability published after the last change still surfaces.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads the SARIF results to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflows themselves (injection, permissions).
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  osv:
    name: OSV-Scanner (bun.lock)
    permissions:
      contents: read
      # The reusable workflow uploads SARIF to the Security tab and reads its own run.
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # The lockfile is what gets installed; package.json ranges are not.
      scan-args: |-
        --lockfile=bun.lock
      fail-on-vuln: true
