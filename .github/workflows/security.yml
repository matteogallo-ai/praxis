name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability published after the last change still surfaces.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads the SARIF results to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflows themselves (injection, permissions).
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  osv:
    name: OSV-Scanner (bun.lock)
    permissions:
      contents: read
      # The reusable workflow uploads SARIF to the Security tab and reads its own run.
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      # The lockfile is what gets installed; package.json ranges are not.
      scan-args: |-
        --lockfile=bun.lock
      fail-on-vuln: true
