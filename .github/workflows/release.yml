# Publishes a GitHub Release for a v* tag: the tag's source archive, its
# build-provenance attestation (SLSA Build L2) and the Sigstore bundle as an
# asset, with the CHANGELOG section as notes.
#
# Pushing a tag publishes nothing by itself: the job waits in the `release`
# environment until its required reviewer approves it (SECURITY.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Creates the GitHub Release and uploads its assets.
      contents: write
      # Signs the attestation through Sigstore and stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Source archive and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="praxis-${version}/" -o "praxis-${version}.tar.gz" "$TAG"
          # The CHANGELOG section of this version, heading excluded; a tag with
          # no section stops here rather than publish empty notes.
          # index() compares literally: the dots of a version are not wildcards.
          awk -v h="## [$version]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: praxis-*.tar.gz
      - name: Publish the release with the signed bundle
        env:
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(ls praxis-*.tar.gz)
          cp "$BUNDLE" "${archive}.sigstore.json"
          gh release create "$TAG" "$archive" "${archive}.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
