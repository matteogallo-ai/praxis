version: 2

# The frozen evaluation set: twelve briefing questions, one target format
# each. Bump `version` when a question is added, removed or edited.
# `benchmarks/split.yaml` (drawn by `benchmarks/split.ts`) records which
# questions are dev and which are test, with this file's SHA-256: the test
# suite fails on any edit here until the split is redrawn.
#
# The `format` field is the canonical routing: `--format auto` reaches the
# same format from the question text alone (tests/benchmarks/questions-schema.test.ts).
#
# Distribution:
#   3 × executive-pre-read       (02, 03, 04)
#   4 × mckinsey-style-note      (01, 05, 06, 07)
#   3 × position-paper-corporate (08, 09, 10)
#   1 × family-office-memo       (11)
#   1 × hard case                (12, mckinsey-style-note, tagged `hard`)

benchmarks:
  - id: "01-german-market-entry"
    question: "Should we enter the German market?"
    format: "mckinsey-style-note"
    tags:
      - market-entry
      - europe
      - mckinsey
    intent: "Canonical 'Should we?' question — trips the mckinsey-style-note trigger phrase. Exercises Situation, Complication, Question, Answer, So-What arc end to end."

  - id: "02-cfo-buyback-briefing"
    question: "Prepare the board briefing on the proposed share buyback."
    format: "executive-pre-read"
    tags:
      - board-decision
      - capital-allocation
    intent: "Board-audience capital-allocation brief. Trips 'board' keyword; exercises executive-pre-read's six-section board discipline."

  - id: "03-executive-succession-planning"
    question: "Draft the executive succession briefing for the incoming CEO."
    format: "executive-pre-read"
    tags:
      - leadership-decision
      - governance
    intent: "Leadership-decision briefing. Trips 'executive' keyword. Human-capital substance, still executive-audience."

  - id: "04-uk-listing-board-briefing"
    question: "Prepare the board pre-read on a proposed UK dual-listing decision."
    format: "executive-pre-read"
    tags:
      - board-decision
      - capital-markets
    intent: "Board-facing listing decision. Trips 'board' keyword. Verifies the exec format still wins even when the question text hints at strategic substance."

  - id: "05-supply-chain-acquisition"
    question: "Should we pursue the acquisition of a European supply-chain competitor?"
    format: "mckinsey-style-note"
    tags:
      - acquisition
      - supply-chain
    intent: "Classic McKinsey-style question — trips 'should we' plus 'acquisition'. Exercises the format's structured argument arc on a portfolio move."

  - id: "06-market-entry-southeast-asia"
    question: "Should we consider strategic market entry into Southeast Asia?"
    format: "mckinsey-style-note"
    tags:
      - market-entry
      - apac
      - strategic
    intent: "Three keyword hits for mckinsey: 'should we', 'strategic', 'market entry'. Different geography from (01) — the mock benchmark set does not over-fit to Germany."

  - id: "07-should-we-divest-consumer-line"
    question: "Should we divest the underperforming consumer product line?"
    format: "mckinsey-style-note"
    tags:
      - portfolio
      - divestiture
    intent: "Portfolio-rebalancing question. 'Should we' is the canonical trigger phrase for mckinsey-style-note; no other keyword group fires."

  - id: "08-ai-regulation-position"
    question: "Draft our corporate position on the incoming AI regulatory framework."
    format: "position-paper-corporate"
    tags:
      - regulatory
      - policy
      - ai-governance
    intent: "Position-paper archetype: regulatory response to a policy framework. Two hits ('position', 'regulatory') both in the position-paper group; exercises the format's five-section arc."

  - id: "09-trade-association-response"
    question: "Prepare our submission to the trade association's public consultation on data localisation."
    format: "position-paper-corporate"
    tags:
      - association
      - policy
      - data
    intent: "Public-consultation submission via a trade association. Trips 'association' keyword; represents the association-facing variant."

  - id: "10-esg-position"
    question: "Publish our updated position on Scope 3 emissions disclosure requirements."
    format: "position-paper-corporate"
    tags:
      - regulatory
      - esg
      - disclosure
    intent: "Public policy statement on a disclosure regime. Trips 'position' keyword; stresses the format's stakeholder-landscape section (regulators, investors, NGOs)."

  - id: "11-family-office-co-investment"
    question: "Should the family council approve the co-investment opportunity in the Zurich-based fintech proposed by our external advisor?"
    format: "family-office-memo"
    tags:
      - family-office
      - co-investment
      - governance
    intent: "Fourth format shipped in v1.2.0. Discreet family-office memo exercising the six-section arc (principal summary, context and heritage, stakeholders, options, risks and preservation, next step). Trips the 'family council' keyword group. Content stresses advisor-conflict governance under STEP / OECD conventions."

  - id: "12-sodium-ion-plant-morocco"
    question: "Should we build a sodium-ion battery cell plant in Morocco to supply European carmakers?"
    format: "mckinsey-style-note"
    tags:
      - hard
      - manufacturing
      - thin-sources
    intent: "Hard case. Morocco has plenty of news on lithium-ion (LFP) gigafactories and little on sodium-ion cells, so the trap is citing lithium-ion sources for sodium-ion claims. Fails if the run aborts (ADR 0002: no research finding sourced) or if a sodium-ion claim cites a source about another chemistry. Passes if it completes and every claim it cannot source on sodium-ion is listed under 'Insufficiently sourced' (insufficiently_sourced: true in metadata.json) rather than stated as fact. The first condition is checked by code; the source-to-claim match by the judge and by hand."
